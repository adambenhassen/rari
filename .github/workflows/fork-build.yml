name: Fork build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version for Linux platform tarballs
        required: true
        type: string
      issue:
        description: Multica issue key for routing this workflow result
        required: false
        type: string
      diagnose_snapshot_profiles:
        description: Compare original and reduced-memory snapshot compiler settings without publishing
        required: false
        default: false
        type: boolean
      delete_test_release:
        description: Delete the test prerelease and its mirrored tag
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    if: ${{ inputs.delete_test_release != true && inputs.delete_test_release != 'true' && inputs.diagnose_snapshot_profiles != true && inputs.diagnose_snapshot_profiles != 'true' }}
    name: Build Linux release
    runs-on: inference-x64
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      NODE_OPTIONS: --max-old-space-size=6144
      PNPM_CONFIG_WORKSPACE_CONCURRENCY: 1
      RUSTUP_TOOLCHAIN: nightly-2026-11-22
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release request
        env:
          BUILD_REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "refs/heads/fork/main" ]]; then
            echo "Dispatch this workflow from fork/main (got $BUILD_REF)" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^0\.17\.9-fork\.[0-9]+(-test\.[0-9]+)?$ ]]; then
            echo "Version must match 0.17.9-fork.<n> or 0.17.9-fork.<n>-test.<n>" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build and ARM64 smoke dependencies
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64-ports.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            binutils mold pkg-config libfontconfig1-dev libclang-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user-static libfontconfig1:arm64 libfontconfig1-dev:arm64

      - name: Bundle React ESM vendor files
        run: pnpm --filter @rari/bundle-react-esm bundle

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-11-22
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Build smoke test app
        run: pnpm --filter @test/app... build

      - name: Create snapshot placeholder
        run: |
          mkdir -p crates/rari/snapshots
          touch crates/rari/snapshots/RARI_SNAPSHOT.bin
          echo 'pub static RESIDUAL_LAZY_ESM_SOURCES: &[(&str, &str)] = &[];' > crates/rari/snapshots/residual_lazy_sources.rs
          echo 'pub static RESIDUAL_LAZY_JS_SOURCES: &[(&str, &str)] = &[];' >> crates/rari/snapshots/residual_lazy_sources.rs

      - name: Generate V8 snapshot
        run: cargo run --release --manifest-path tools/snapshot/Cargo.toml -- crates/rari/snapshots
        env:
          # The generator is not shipped; avoid fat cross-crate LTO.
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_DEBUG: none
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes

      - name: Build Linux x64 binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin rari --features ext-full,jemalloc
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes

      - name: Build and run the ARM64 snapshot generator
        run: |
          set -euo pipefail
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          export RUSTFLAGS='-Cforce-frame-pointers=yes'
          cargo build --release --manifest-path tools/snapshot/Cargo.toml \
            --target aarch64-unknown-linux-gnu
          qemu-aarch64-static -L /usr/aarch64-linux-gnu \
            target/aarch64-unknown-linux-gnu/release/rari-snapshot crates/rari/snapshots
        env:
          # The generator is not shipped; avoid fat cross-crate LTO.
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_DEBUG: none
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'

      - name: Build Linux ARM64 binary
        run: |
          set -euo pipefail
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          export RUSTFLAGS='-Cforce-frame-pointers=yes'
          cargo build --release --target aarch64-unknown-linux-gnu --bin rari --features ext-full,jemalloc
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'

      - name: Smoke-test Linux ARM64 binary under QEMU
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/target/aarch64-unknown-linux-gnu/release/rari"
          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$binary" --version
          cd test/fixtures/app
          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$binary" \
            --mode production --host 127.0.0.1 --port 43819 \
            > "$RUNNER_TEMP/rari-arm64-smoke.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          rendered=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:43819/ \
              --output "$RUNNER_TEMP/rari-arm64-render.html"; then
              rendered=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/rari-arm64-smoke.log"
              exit 1
            fi
            sleep 1
          done
          if [[ "$rendered" != true ]] || ! grep -Fq 'Test App Home' "$RUNNER_TEMP/rari-arm64-render.html"; then
            cat "$RUNNER_TEMP/rari-arm64-smoke.log"
            echo 'ARM64 server did not render the smoke-test page' >&2
            exit 1
          fi

      - name: Prepare Linux binaries and debug sidecars
        run: |
          set -euo pipefail
          mkdir -p release-assets
          x64=target/x86_64-unknown-linux-gnu/release/rari
          arm64=target/aarch64-unknown-linux-gnu/release/rari
          objcopy --only-keep-debug "$x64" release-assets/rari-linux-x64.debug
          objcopy --strip-debug "$x64" release-assets/rari-linux-x64
          objcopy --add-gnu-debuglink=release-assets/rari-linux-x64.debug release-assets/rari-linux-x64
          aarch64-linux-gnu-objcopy --only-keep-debug "$arm64" release-assets/rari-linux-arm64.debug
          aarch64-linux-gnu-objcopy --strip-debug "$arm64" release-assets/rari-linux-arm64
          aarch64-linux-gnu-objcopy --add-gnu-debuglink=release-assets/rari-linux-arm64.debug release-assets/rari-linux-arm64
          chmod +x release-assets/rari-linux-x64 release-assets/rari-linux-arm64
          file release-assets/rari-linux-x64 release-assets/rari-linux-arm64

      - name: Package Linux npm tarballs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-tarballs

          build_platform() {
            local platform="$1" cpu="$2" description="$3"
            local pkg="rari-${platform}"
            local dir="packages/${pkg}"
            mkdir -p "${dir}/bin"
            cp "release-assets/${pkg}" "${dir}/bin/rari"
            chmod +x "${dir}/bin/rari"
            cat > "${dir}/package.json" <<EOF
          {
            "name": "${pkg}",
            "type": "module",
            "version": "${VERSION}",
            "description": "Runtime Accelerated Rendering Infrastructure (${description})",
            "author": "Ryan Skinner",
            "license": "MIT",
            "os": ["linux"],
            "cpu": ["${cpu}"],
            "homepage": "https://github.com/rari-build/rari#readme",
            "bin": {"rari": "./bin/rari"},
            "files": ["LICENSE", "README.md", "bin/rari"],
            "engines": {"node": ">=22.12.0"}
          }
          EOF
            cp LICENSE "${dir}/LICENSE"
            printf '# %s\n' "${pkg}" > "${dir}/README.md"
            (cd "${dir}" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs")
          }

          build_platform linux-x64 x64 'Linux x64 binary'
          build_platform linux-arm64 arm64 'Linux ARM64 binary'
          ls -lh dist-tarballs release-assets

      - name: Record Linux tarball checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build-provenance
          (
            cd dist-tarballs
            sha256sum \
              "rari-linux-x64-${VERSION}.tgz" \
              "rari-linux-arm64-${VERSION}.tgz"
          ) > build-provenance/SHA256SUMS
          cat build-provenance/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux build provenance
        uses: ChristopherHX/gitea-upload-artifact@62ac910c5d3dfa85c7cb2df15afe2e342b2407c2 # Gitea-compatible v4 fork
        with:
          name: fork-build-provenance-${{ inputs.version }}
          path: build-provenance/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Upload release assets for the trusted publisher
        uses: ChristopherHX/gitea-upload-artifact@62ac910c5d3dfa85c7cb2df15afe2e342b2407c2 # Gitea-compatible v4 fork
        with:
          name: fork-release-assets
          path: |
            dist-tarballs/
            release-assets/
          if-no-files-found: error
          retention-days: 1

      - name: Smoke-test packaged Linux x64 binary on the production base image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          smoke_container="$(docker create --platform linux/amd64 \
            node:24-trixie-slim node -e 'setInterval(() => {}, 60000)')"
          cleanup() {
            docker rm --force "$smoke_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker start "$smoke_container" >/dev/null
          docker exec "$smoke_container" mkdir -p /workspace/dist-tarballs /workspace/test/fixtures
          docker cp \
            "$GITHUB_WORKSPACE/dist-tarballs/rari-linux-x64-${VERSION}.tgz" \
            "$smoke_container:/workspace/dist-tarballs/"
          tar -C "$GITHUB_WORKSPACE/test/fixtures" -chf - app \
            | docker cp - "$smoke_container:/workspace/test/fixtures/"
          docker exec --env VERSION="$VERSION" "$smoke_container" sh -euc '
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl libfontconfig1
              mkdir -p /tmp/rari-package
              tar -xzf "/workspace/dist-tarballs/rari-linux-x64-${VERSION}.tgz" \
                -C /tmp/rari-package --strip-components=1
              cd /workspace/test/fixtures/app
              /tmp/rari-package/bin/rari --version
              /tmp/rari-package/bin/rari --mode production --host 127.0.0.1 --port 43820 \
                > /tmp/rari-x64-smoke.log 2>&1 &
              server_pid=$!
              cleanup() {
                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
              }
              trap cleanup EXIT
              rendered=false
              for attempt in $(seq 1 60); do
                if curl --fail --silent http://127.0.0.1:43820/ \
                  --output /tmp/rari-x64-render.html; then
                  rendered=true
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  cat /tmp/rari-x64-smoke.log
                  exit 1
                fi
                sleep 1
              done
              if [ "$rendered" != true ] || ! grep -Fq "Test App Home" /tmp/rari-x64-render.html; then
                cat /tmp/rari-x64-smoke.log
                echo "Packaged x64 binary did not render the smoke-test page" >&2
                exit 1
              fi
            '

  check-snapshot-profile-diagnostic:
    if: ${{ (inputs.diagnose_snapshot_profiles == true || inputs.diagnose_snapshot_profiles == 'true') && inputs.delete_test_release != true && inputs.delete_test_release != 'true' }}
    name: 'check: snapshot-profile-diagnostic'
    runs-on: inference-x64
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: nightly-2026-11-22
      RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-11-22

      - name: Install Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libclang-dev mold

      - name: Create snapshot placeholder
        run: |
          mkdir -p crates/rari/snapshots
          touch crates/rari/snapshots/RARI_SNAPSHOT.bin
          echo 'pub static RESIDUAL_LAZY_ESM_SOURCES: &[(&str, &str)] = &[];' > crates/rari/snapshots/residual_lazy_sources.rs
          echo 'pub static RESIDUAL_LAZY_JS_SOURCES: &[(&str, &str)] = &[];' >> crates/rari/snapshots/residual_lazy_sources.rs

      - name: Prepare compiler and resource recorders
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rustc-status-wrapper.sh" <<'WRAPPER'
          #!/usr/bin/env bash
          set +e
          "$@"
          rustc_status=$?
          if [[ " $* " == *" --crate-name rari_snapshot "* ]]; then
            printf 'RUSTC_EXIT_STATUS=%s\n' "$rustc_status" >&2
            if (( rustc_status >= 128 )); then
              signal=$((rustc_status - 128))
              signal_name=$(kill -l "$signal" 2>/dev/null || true)
              printf 'RUSTC_TERMINATION_SIGNAL=%s (%s)\n' "$signal" "$signal_name" >&2
            fi
          fi
          exit "$rustc_status"
          WRAPPER
          cat > "$RUNNER_TEMP/snapshot-runner-resources.sh" <<'RESOURCES'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "=== runner resource snapshot: $1 ==="
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo || true
          for path in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [[ -r "$path" ]]; then
              echo "--- $path ---"
              cat "$path"
            else
              echo "--- $path unavailable ---"
            fi
          done
          for path in /proc/pressure/memory /proc/pressure/io; do
            if [[ -r "$path" ]]; then
              echo "--- $path ---"
              cat "$path"
            fi
          done
          grep -E '^(oom_kill|pgmajfault) ' /proc/vmstat || true
          RESOURCES
          chmod +x "$RUNNER_TEMP/rustc-status-wrapper.sh" "$RUNNER_TEMP/snapshot-runner-resources.sh"
          echo "RUSTC_WRAPPER=$RUNNER_TEMP/rustc-status-wrapper.sh" >> "$GITHUB_ENV"
          echo "SNAPSHOT_RESOURCE_SNAPSHOT=$RUNNER_TEMP/snapshot-runner-resources.sh" >> "$GITHUB_ENV"

      - name: Build snapshot with original release settings
        id: original
        run: |
          set -euo pipefail
          "$SNAPSHOT_RESOURCE_SNAPSHOT" original-before
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/snapshot-original-target" \
            cargo build --release --manifest-path tools/snapshot/Cargo.toml
          cargo_status=$?
          set -e
          printf 'ORIGINAL_CARGO_EXIT_STATUS=%s\n' "$cargo_status"
          echo "cargo_exit_status=$cargo_status" >> "$GITHUB_OUTPUT"
          "$SNAPSHOT_RESOURCE_SNAPSHOT" original-after
          rm -rf "$RUNNER_TEMP/snapshot-original-target"

        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          CARGO_PROFILE_RELEASE_LTO: fat

      - name: Build snapshot with proposed release settings
        id: proposed
        run: |
          set -euo pipefail
          "$SNAPSHOT_RESOURCE_SNAPSHOT" proposed-before
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/snapshot-proposed-target" \
            cargo build --release --manifest-path tools/snapshot/Cargo.toml
          cargo_status=$?
          set -e
          printf 'PROPOSED_CARGO_EXIT_STATUS=%s\n' "$cargo_status"
          echo "cargo_exit_status=$cargo_status" >> "$GITHUB_OUTPUT"
          "$SNAPSHOT_RESOURCE_SNAPSHOT" proposed-after
          rm -rf "$RUNNER_TEMP/snapshot-proposed-target"
          if (( cargo_status != 0 )); then
            exit "$cargo_status"
          fi

        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_DEBUG: none
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'

  publish-release:
    if: ${{ inputs.delete_test_release != true && inputs.delete_test_release != 'true' && inputs.diagnose_snapshot_profiles != true && inputs.diagnose_snapshot_profiles != 'true' && github.ref == 'refs/heads/fork/main' }}
    name: Publish Linux release
    needs: build
    runs-on: inference-x64
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Download release assets
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # Gitea-compatible v4 fork
        with:
          name: fork-release-assets

      - name: Publish Gitea prerelease and wait for the mirrored tag
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: node .github/scripts/fork-release.mjs

  validate-cleanup-ref:
    if: ${{ inputs.delete_test_release == true || inputs.delete_test_release == 'true' }}
    name: Validate cleanup source ref
    runs-on: inference-x64
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate cleanup ref
        env:
          BUILD_REF: ${{ github.ref }}
          DIAGNOSE_SNAPSHOT_PROFILES: ${{ inputs.diagnose_snapshot_profiles }}
        run: |
          set -euo pipefail
          if [[ "$DIAGNOSE_SNAPSHOT_PROFILES" == "true" ]]; then
            echo "Cannot combine delete_test_release with diagnose_snapshot_profiles" >&2
            exit 1
          fi
          if [[ "$BUILD_REF" != "refs/heads/fork/main" ]]; then
            echo "Dispatch this workflow from fork/main (got $BUILD_REF)" >&2
            exit 1
          fi

  delete-test-release:
    if: ${{ (inputs.delete_test_release == true || inputs.delete_test_release == 'true') && inputs.diagnose_snapshot_profiles != true && inputs.diagnose_snapshot_profiles != 'true' && github.ref == 'refs/heads/fork/main' }}
    name: Delete test release
    needs: validate-cleanup-ref
    runs-on: inference-x64
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Delete Gitea test release and mirrored tag
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          DELETE_TEST_RELEASE: 'true'
        run: node .github/scripts/fork-release.mjs
