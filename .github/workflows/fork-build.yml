name: Fork build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version for Linux platform tarballs
        required: true
        type: string
      issue:
        description: Multica issue key for routing this workflow result
        required: false
        type: string
      diagnose_snapshot_profiles:
        description: Compare original and reduced-memory snapshot compiler settings without publishing
        required: false
        default: false
        type: boolean
      delete_test_release:
        description: Delete the test prerelease and its mirrored tag
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  validate-release-request:
    if: ${{ inputs.delete_test_release != true && inputs.delete_test_release != 'true' && inputs.diagnose_snapshot_profiles != true && inputs.diagnose_snapshot_profiles != 'true' }}
    name: Validate release request
    runs-on: rari
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate release request
        env:
          BUILD_REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "refs/heads/fork/main" ]]; then
            echo "Dispatch this workflow from fork/main (got $BUILD_REF)" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^0\.17\.9-fork\.[0-9]+(-test\.[0-9]+)?$ ]]; then
            echo "Version must match 0.17.9-fork.<n> or 0.17.9-fork.<n>-test.<n>" >&2
            exit 1
          fi

  build:
    needs: validate-release-request
    name: Build Linux release (${{ matrix.arch }})
    runs-on: rari
    timeout-minutes: 175
    strategy:
      matrix:
        include:
          - arch: x64
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      NODE_OPTIONS: --max-old-space-size=6144
      PNPM_CONFIG_WORKSPACE_CONCURRENCY: 1
      RUSTUP_TOOLCHAIN: nightly-2026-11-22
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release request
        env:
          BUILD_REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "refs/heads/fork/main" ]]; then
            echo "Dispatch this workflow from fork/main (got $BUILD_REF)" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^0\.17\.9-fork\.[0-9]+(-test\.[0-9]+)?$ ]]; then
            echo "Version must match 0.17.9-fork.<n> or 0.17.9-fork.<n>-test.<n>" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils mold pkg-config libfontconfig1-dev libclang-dev

      - name: Bundle React ESM vendor files
        run: pnpm --filter @rari/bundle-react-esm bundle

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-11-22

      - name: Build smoke test app
        run: pnpm --filter @test/app... build

      - name: Create snapshot placeholder
        run: |
          mkdir -p crates/rari/snapshots
          touch crates/rari/snapshots/RARI_SNAPSHOT.bin
          echo 'pub static RESIDUAL_LAZY_ESM_SOURCES: &[(&str, &str)] = &[];' > crates/rari/snapshots/residual_lazy_sources.rs
          echo 'pub static RESIDUAL_LAZY_JS_SOURCES: &[(&str, &str)] = &[];' >> crates/rari/snapshots/residual_lazy_sources.rs

      - name: Generate x64 V8 snapshot
        if: matrix.arch == 'x64'
        run: cargo run --release --manifest-path tools/snapshot/Cargo.toml -- crates/rari/snapshots
        env:
          # The generator is not shipped; avoid fat cross-crate LTO.
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_DEBUG: none
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes

      - name: Build Linux x64 binary
        if: matrix.arch == 'x64'
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin rari --features ext-full,jemalloc
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes

      - name: Prepare and package Linux release assets
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            x64)
              binary=target/x86_64-unknown-linux-gnu/release/rari
              objcopy=objcopy
              readelf=readelf
              platform=linux-x64
              cpu=x64
              description='Linux x64 binary'
              ;;
            arm64)
              binary=target/aarch64-unknown-linux-gnu/release/rari
              objcopy=aarch64-linux-gnu-objcopy
              readelf=aarch64-linux-gnu-readelf
              platform=linux-arm64
              cpu=arm64
              description='Linux ARM64 binary'
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac

          mkdir -p release-assets
          "$objcopy" --only-keep-debug "$binary" "release-assets/rari-${platform}.debug"
          "$objcopy" --strip-debug "$binary" "release-assets/rari-${platform}"
          "$objcopy" --add-gnu-debuglink="release-assets/rari-${platform}.debug" "release-assets/rari-${platform}"
          chmod +x "release-assets/rari-${platform}"
          file "release-assets/rari-$platform"
          bash .github/scripts/check-glibc-version.sh "release-assets/rari-$platform" "$readelf" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          mkdir -p dist-tarballs

          build_platform() {
            local platform="$1" cpu="$2" description="$3"
            local pkg="rari-${platform}"
            local dir="packages/${pkg}"
            mkdir -p "${dir}/bin"
            cp "release-assets/${pkg}" "${dir}/bin/rari"
            chmod +x "${dir}/bin/rari"
            cat > "${dir}/package.json" <<EOF
          {
            "name": "${pkg}",
            "type": "module",
            "version": "${VERSION}",
            "description": "Runtime Accelerated Rendering Infrastructure (${description})",
            "author": "Ryan Skinner",
            "license": "MIT",
            "os": ["linux"],
            "cpu": ["${cpu}"],
            "homepage": "https://github.com/rari-build/rari#readme",
            "bin": {"rari": "./bin/rari"},
            "files": ["LICENSE", "README.md", "bin/rari"],
            "engines": {"node": ">=22.12.0"}
          }
          EOF
            cp LICENSE "${dir}/LICENSE"
            printf '# %s\n' "${pkg}" > "${dir}/README.md"
            (cd "${dir}" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs")
          }

          build_platform "$platform" "$cpu" "$description"
          ls -lh dist-tarballs release-assets

      - name: Smoke-test packaged Linux x64 binary on the production base image
        if: matrix.arch == 'x64'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          smoke_container="$(docker create --platform linux/amd64 \
            node:24-trixie-slim node -e 'setInterval(() => {}, 60000)')"
          cleanup() {
            docker rm --force "$smoke_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker start "$smoke_container" >/dev/null
          docker exec "$smoke_container" mkdir -p /workspace/dist-tarballs /workspace/test/fixtures
          docker cp \
            "$GITHUB_WORKSPACE/dist-tarballs/rari-linux-x64-${VERSION}.tgz" \
            "$smoke_container:/workspace/dist-tarballs/"
          tar -C "$GITHUB_WORKSPACE/test/fixtures" -chf - app \
            | docker cp - "$smoke_container:/workspace/test/fixtures/"
          docker exec --env VERSION="$VERSION" "$smoke_container" sh -euc '
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl libfontconfig1
              mkdir -p /tmp/rari-package
              tar -xzf "/workspace/dist-tarballs/rari-linux-x64-${VERSION}.tgz" \
                -C /tmp/rari-package --strip-components=1
              cd /workspace/test/fixtures/app
              /tmp/rari-package/bin/rari --version
              /tmp/rari-package/bin/rari --mode production --host 127.0.0.1 --port 43820 \
                > /tmp/rari-x64-smoke.log 2>&1 &
              server_pid=$!
              cleanup() {
                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
              }
              trap cleanup EXIT
              rendered=false
              for attempt in $(seq 1 60); do
                if curl --fail --silent http://127.0.0.1:43820/ \
                  --output /tmp/rari-x64-render.html; then
                  rendered=true
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  cat /tmp/rari-x64-smoke.log
                  exit 1
                fi
                sleep 1
              done
              if [ "$rendered" != true ] || ! grep -Fq "Test App Home" /tmp/rari-x64-render.html; then
                cat /tmp/rari-x64-smoke.log
                echo "Packaged x64 binary did not render the smoke-test page" >&2
                exit 1
              fi
              cat /tmp/rari-x64-smoke.log
            '

      - name: Upload Linux assets for the trusted publisher
        uses: ChristopherHX/gitea-upload-artifact@62ac910c5d3dfa85c7cb2df15afe2e342b2407c2 # Gitea-compatible v4 fork
        with:
          name: fork-release-assets-${{ matrix.arch }}
          path: |
            dist-tarballs/
            release-assets/
          if-no-files-found: error
          retention-days: 2

  build-arm64:
    needs: build
    if: ${{ inputs.delete_test_release != true && inputs.delete_test_release != 'true' && inputs.diagnose_snapshot_profiles != true && inputs.diagnose_snapshot_profiles != 'true' }}
    name: Build Linux release (${{ matrix.arch }})
    runs-on: rari
    timeout-minutes: 175
    strategy:
      matrix:
        include:
          - arch: arm64
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      NODE_OPTIONS: --max-old-space-size=6144
      PNPM_CONFIG_WORKSPACE_CONCURRENCY: 1
      RUSTUP_TOOLCHAIN: nightly-2026-11-22
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          . /etc/os-release
          if [[ "$ID" != "ubuntu" || "$VERSION_ID" != "24.04" ]]; then
            echo "Expected the Ubuntu 24.04 cross-build environment, found $ID $VERSION_ID" >&2
            exit 1
          fi
          printf '%s\n' \
            "deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports/ $VERSION_CODENAME main restricted universe multiverse" \
            "deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports/ $VERSION_CODENAME-updates main restricted universe multiverse" \
            "deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports/ $VERSION_CODENAME-security main restricted universe multiverse" \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            binutils mold pkg-config libfontconfig1-dev libclang-dev \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            libfontconfig1-dev:arm64 qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64

      - name: Bundle React ESM vendor files
        run: pnpm --filter @rari/bundle-react-esm bundle

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-11-22
          targets: aarch64-unknown-linux-gnu

      - name: Build smoke test app
        run: pnpm --filter @test/app... build

      - name: Create snapshot placeholder
        run: |
          mkdir -p crates/rari/snapshots
          touch crates/rari/snapshots/RARI_SNAPSHOT.bin
          echo 'pub static RESIDUAL_LAZY_ESM_SOURCES: &[(&str, &str)] = &[];' > crates/rari/snapshots/residual_lazy_sources.rs
          echo 'pub static RESIDUAL_LAZY_JS_SOURCES: &[(&str, &str)] = &[];' >> crates/rari/snapshots/residual_lazy_sources.rs

      - name: Generate x64 V8 snapshot
        if: matrix.arch == 'x64'
        run: cargo run --release --manifest-path tools/snapshot/Cargo.toml -- crates/rari/snapshots
        env:
          # The generator is not shipped; avoid fat cross-crate LTO.
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_DEBUG: none
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes

      - name: Build Linux x64 binary
        if: matrix.arch == 'x64'
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin rari --features ext-full,jemalloc
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes

      - name: Generate ARM64 V8 snapshot
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-unknown-linux-gnu \
            --manifest-path tools/snapshot/Cargo.toml
          qemu-aarch64-static -L / \
            target/aarch64-unknown-linux-gnu/release/rari-snapshot \
            crates/rari/snapshots
        env:
          # The generator is not shipped; avoid fat cross-crate LTO.
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_DEBUG: none
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          RUSTFLAGS: -Cforce-frame-pointers=yes

      - name: Build Linux ARM64 binary
        if: matrix.arch == 'arm64'
        run: cargo build --release --target aarch64-unknown-linux-gnu --bin rari --features ext-full,jemalloc
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          RUSTFLAGS: -Cforce-frame-pointers=yes

      - name: Prepare and package Linux release assets
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            x64)
              binary=target/x86_64-unknown-linux-gnu/release/rari
              objcopy=objcopy
              readelf=readelf
              platform=linux-x64
              cpu=x64
              description='Linux x64 binary'
              ;;
            arm64)
              binary=target/aarch64-unknown-linux-gnu/release/rari
              objcopy=aarch64-linux-gnu-objcopy
              readelf=aarch64-linux-gnu-readelf
              platform=linux-arm64
              cpu=arm64
              description='Linux ARM64 binary'
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac

          mkdir -p release-assets
          "$objcopy" --only-keep-debug "$binary" "release-assets/rari-${platform}.debug"
          "$objcopy" --strip-debug "$binary" "release-assets/rari-${platform}"
          "$objcopy" --add-gnu-debuglink="release-assets/rari-${platform}.debug" "release-assets/rari-${platform}"
          chmod +x "release-assets/rari-${platform}"
          file "release-assets/rari-$platform"
          bash .github/scripts/check-glibc-version.sh "release-assets/rari-$platform" "$readelf" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          mkdir -p dist-tarballs

          build_platform() {
            local platform="$1" cpu="$2" description="$3"
            local pkg="rari-${platform}"
            local dir="packages/${pkg}"
            mkdir -p "${dir}/bin"
            cp "release-assets/${pkg}" "${dir}/bin/rari"
            chmod +x "${dir}/bin/rari"
            cat > "${dir}/package.json" <<EOF
          {
            "name": "${pkg}",
            "type": "module",
            "version": "${VERSION}",
            "description": "Runtime Accelerated Rendering Infrastructure (${description})",
            "author": "Ryan Skinner",
            "license": "MIT",
            "os": ["linux"],
            "cpu": ["${cpu}"],
            "homepage": "https://github.com/rari-build/rari#readme",
            "bin": {"rari": "./bin/rari"},
            "files": ["LICENSE", "README.md", "bin/rari"],
            "engines": {"node": ">=22.12.0"}
          }
          EOF
            cp LICENSE "${dir}/LICENSE"
            printf '# %s\n' "${pkg}" > "${dir}/README.md"
            (cd "${dir}" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs")
          }

          build_platform "$platform" "$cpu" "$description"
          ls -lh dist-tarballs release-assets

      - name: Smoke-test packaged Linux x64 binary on the production base image
        if: matrix.arch == 'x64'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          smoke_container="$(docker create --platform linux/amd64 \
            node:24-trixie-slim node -e 'setInterval(() => {}, 60000)')"
          cleanup() {
            docker rm --force "$smoke_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker start "$smoke_container" >/dev/null
          docker exec "$smoke_container" mkdir -p /workspace/dist-tarballs /workspace/test/fixtures
          docker cp \
            "$GITHUB_WORKSPACE/dist-tarballs/rari-linux-x64-${VERSION}.tgz" \
            "$smoke_container:/workspace/dist-tarballs/"
          tar -C "$GITHUB_WORKSPACE/test/fixtures" -chf - app \
            | docker cp - "$smoke_container:/workspace/test/fixtures/"
          docker exec --env VERSION="$VERSION" "$smoke_container" sh -euc '
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl libfontconfig1
              mkdir -p /tmp/rari-package
              tar -xzf "/workspace/dist-tarballs/rari-linux-x64-${VERSION}.tgz" \
                -C /tmp/rari-package --strip-components=1
              cd /workspace/test/fixtures/app
              /tmp/rari-package/bin/rari --version
              /tmp/rari-package/bin/rari --mode production --host 127.0.0.1 --port 43820 \
                > /tmp/rari-x64-smoke.log 2>&1 &
              server_pid=$!
              cleanup() {
                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
              }
              trap cleanup EXIT
              rendered=false
              for attempt in $(seq 1 60); do
                if curl --fail --silent http://127.0.0.1:43820/ \
                  --output /tmp/rari-x64-render.html; then
                  rendered=true
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  cat /tmp/rari-x64-smoke.log
                  exit 1
                fi
                sleep 1
              done
              if [ "$rendered" != true ] || ! grep -Fq "Test App Home" /tmp/rari-x64-render.html; then
                cat /tmp/rari-x64-smoke.log
                echo "Packaged x64 binary did not render the smoke-test page" >&2
                exit 1
              fi
            '

      - name: Upload Linux assets for the trusted publisher
        uses: ChristopherHX/gitea-upload-artifact@62ac910c5d3dfa85c7cb2df15afe2e342b2407c2 # Gitea-compatible v4 fork
        with:
          name: fork-release-assets-${{ matrix.arch }}
          path: |
            dist-tarballs/
            release-assets/
          if-no-files-found: error
          retention-days: 2

  smoke-arm64:
    needs: build-arm64
    name: Smoke-test Linux ARM64 release
    runs-on: rari
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enable ARM64 emulation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64

      - name: Download ARM64 release assets
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # Gitea-compatible v4 fork
        with:
          name: fork-release-assets-arm64

      - name: Smoke-test packaged Linux ARM64 binary on the production base image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tarball="$GITHUB_WORKSPACE/dist-tarballs/rari-linux-arm64-$VERSION.tgz"
          test -f "$tarball"
          smoke_container="$(docker create --platform linux/arm64 \
            node:24-trixie-slim node -e 'setInterval(() => {}, 60000)')"
          cleanup() {
            docker rm --force "$smoke_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker start "$smoke_container" >/dev/null
          docker exec "$smoke_container" mkdir -p /workspace/dist-tarballs /workspace/test/fixtures
          docker cp "$tarball" "$smoke_container:/workspace/dist-tarballs/"
          tar -C "$GITHUB_WORKSPACE/test/fixtures" -chf - app \
            | docker cp - "$smoke_container:/workspace/test/fixtures/"
          docker exec --env VERSION="$VERSION" "$smoke_container" sh -euc '
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl libfontconfig1
              test "$(node -p "process.arch")" = arm64
              mkdir -p /tmp/rari-package
              tar -xzf "/workspace/dist-tarballs/rari-linux-arm64-$VERSION.tgz" \
                -C /tmp/rari-package --strip-components=1
              cd /workspace/test/fixtures/app
              /tmp/rari-package/bin/rari --version
              /tmp/rari-package/bin/rari --mode production --host 127.0.0.1 --port 43821 \
                > /tmp/rari-arm64-smoke.log 2>&1 &
              server_pid=$!
              cleanup() {
                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
              }
              trap cleanup EXIT
              rendered=false
              for attempt in $(seq 1 120); do
                if curl --fail --silent http://127.0.0.1:43821/ \
                  --output /tmp/rari-arm64-render.html; then
                  rendered=true
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  cat /tmp/rari-arm64-smoke.log
                  exit 1
                fi
                sleep 1
              done
              if [ "$rendered" != true ] || ! grep -Fq "Test App Home" /tmp/rari-arm64-render.html; then
                cat /tmp/rari-arm64-smoke.log
                echo "Packaged ARM64 binary did not render the smoke-test page" >&2
                exit 1
              fi
              cat /tmp/rari-arm64-smoke.log
            '

  check-snapshot-profile-diagnostic:
    if: ${{ (inputs.diagnose_snapshot_profiles == true || inputs.diagnose_snapshot_profiles == 'true') && inputs.delete_test_release != true && inputs.delete_test_release != 'true' }}
    name: 'check: snapshot-profile-diagnostic'
    runs-on: rari
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: nightly-2026-11-22
      RUSTFLAGS: -C link-arg=-fuse-ld=mold -Cforce-frame-pointers=yes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-11-22

      - name: Install Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libclang-dev mold

      - name: Create snapshot placeholder
        run: |
          mkdir -p crates/rari/snapshots
          touch crates/rari/snapshots/RARI_SNAPSHOT.bin
          echo 'pub static RESIDUAL_LAZY_ESM_SOURCES: &[(&str, &str)] = &[];' > crates/rari/snapshots/residual_lazy_sources.rs
          echo 'pub static RESIDUAL_LAZY_JS_SOURCES: &[(&str, &str)] = &[];' >> crates/rari/snapshots/residual_lazy_sources.rs

      - name: Prepare compiler and resource recorders
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rustc-status-wrapper.sh" <<'WRAPPER'
          #!/usr/bin/env bash
          set +e
          "$@"
          rustc_status=$?
          if [[ " $* " == *" --crate-name rari_snapshot "* ]]; then
            printf 'RUSTC_EXIT_STATUS=%s\n' "$rustc_status" >&2
            if (( rustc_status >= 128 )); then
              signal=$((rustc_status - 128))
              signal_name=$(kill -l "$signal" 2>/dev/null || true)
              printf 'RUSTC_TERMINATION_SIGNAL=%s (%s)\n' "$signal" "$signal_name" >&2
            fi
          fi
          exit "$rustc_status"
          WRAPPER
          cat > "$RUNNER_TEMP/snapshot-runner-resources.sh" <<'RESOURCES'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "=== runner resource snapshot: $1 ==="
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo || true
          for path in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [[ -r "$path" ]]; then
              echo "--- $path ---"
              cat "$path"
            else
              echo "--- $path unavailable ---"
            fi
          done
          for path in /proc/pressure/memory /proc/pressure/io; do
            if [[ -r "$path" ]]; then
              echo "--- $path ---"
              cat "$path"
            fi
          done
          grep -E '^(oom_kill|pgmajfault) ' /proc/vmstat || true
          RESOURCES
          chmod +x "$RUNNER_TEMP/rustc-status-wrapper.sh" "$RUNNER_TEMP/snapshot-runner-resources.sh"
          echo "RUSTC_WRAPPER=$RUNNER_TEMP/rustc-status-wrapper.sh" >> "$GITHUB_ENV"
          echo "SNAPSHOT_RESOURCE_SNAPSHOT=$RUNNER_TEMP/snapshot-runner-resources.sh" >> "$GITHUB_ENV"

      - name: Build snapshot with original release settings
        id: original
        run: |
          set -euo pipefail
          "$SNAPSHOT_RESOURCE_SNAPSHOT" original-before
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/snapshot-original-target" \
            cargo build --release --manifest-path tools/snapshot/Cargo.toml
          cargo_status=$?
          set -e
          printf 'ORIGINAL_CARGO_EXIT_STATUS=%s\n' "$cargo_status"
          echo "cargo_exit_status=$cargo_status" >> "$GITHUB_OUTPUT"
          "$SNAPSHOT_RESOURCE_SNAPSHOT" original-after
          rm -rf "$RUNNER_TEMP/snapshot-original-target"

        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          CARGO_PROFILE_RELEASE_LTO: fat

      - name: Build snapshot with proposed release settings
        id: proposed
        run: |
          set -euo pipefail
          "$SNAPSHOT_RESOURCE_SNAPSHOT" proposed-before
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/snapshot-proposed-target" \
            cargo build --release --manifest-path tools/snapshot/Cargo.toml
          cargo_status=$?
          set -e
          printf 'PROPOSED_CARGO_EXIT_STATUS=%s\n' "$cargo_status"
          echo "cargo_exit_status=$cargo_status" >> "$GITHUB_OUTPUT"
          "$SNAPSHOT_RESOURCE_SNAPSHOT" proposed-after
          rm -rf "$RUNNER_TEMP/snapshot-proposed-target"
          if (( cargo_status != 0 )); then
            exit "$cargo_status"
          fi

        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_RELEASE_DEBUG: none
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'false'

  publish-release:
    if: ${{ inputs.delete_test_release != true && inputs.delete_test_release != 'true' && inputs.diagnose_snapshot_profiles != true && inputs.diagnose_snapshot_profiles != 'true' && github.ref == 'refs/heads/fork/main' }}
    name: Publish Linux release
    needs: [build, build-arm64, smoke-arm64, validate-release-request]
    runs-on: rari
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Download x64 release assets
        id: download-x64
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # Gitea-compatible v4 fork
        with:
          name: fork-release-assets-x64
        continue-on-error: true

      - name: Download ARM64 release assets
        id: download-arm64
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # Gitea-compatible v4 fork
        with:
          name: fork-release-assets-arm64
        continue-on-error: true

      - name: Validate release artifacts for this attempt
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          X64_DOWNLOAD_OUTCOME: ${{ steps.download-x64.outcome }}
          ARM64_DOWNLOAD_OUTCOME: ${{ steps.download-arm64.outcome }}
        run: |
          set -euo pipefail
          if [[ "$X64_DOWNLOAD_OUTCOME" != "success" || "$ARM64_DOWNLOAD_OUTCOME" != "success" ]]; then
            echo "::error::Release artifacts are missing from this workflow attempt. Use 'Re-run all jobs' to rebuild both architectures in the same attempt."
            exit 1
          fi
          for arch in x64 arm64; do
            tarball="dist-tarballs/rari-linux-${arch}-${VERSION}.tgz"
            if [[ ! -f "$tarball" ]]; then
              echo "::error::Missing $tarball from this workflow attempt. Use 'Re-run all jobs' to rebuild both architectures in the same attempt."
              exit 1
            fi
          done

      - name: Record Linux tarball checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build-provenance
          (
            cd dist-tarballs
            sha256sum \
              "rari-linux-x64-${VERSION}.tgz" \
              "rari-linux-arm64-${VERSION}.tgz"
          ) > build-provenance/SHA256SUMS
          cat build-provenance/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux build provenance
        uses: ChristopherHX/gitea-upload-artifact@62ac910c5d3dfa85c7cb2df15afe2e342b2407c2 # Gitea-compatible v4 fork
        with:
          name: fork-build-provenance-${{ inputs.version }}
          path: build-provenance/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Publish Gitea prerelease and wait for the mirrored tag
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: node .github/scripts/fork-release.mjs

  validate-cleanup-ref:
    if: ${{ inputs.delete_test_release == true || inputs.delete_test_release == 'true' }}
    name: Validate cleanup source ref
    runs-on: rari
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate cleanup ref
        env:
          BUILD_REF: ${{ github.ref }}
          DIAGNOSE_SNAPSHOT_PROFILES: ${{ inputs.diagnose_snapshot_profiles }}
        run: |
          set -euo pipefail
          if [[ "$DIAGNOSE_SNAPSHOT_PROFILES" == "true" ]]; then
            echo "Cannot combine delete_test_release with diagnose_snapshot_profiles" >&2
            exit 1
          fi
          if [[ "$BUILD_REF" != "refs/heads/fork/main" ]]; then
            echo "Dispatch this workflow from fork/main (got $BUILD_REF)" >&2
            exit 1
          fi

  delete-test-release:
    if: ${{ (inputs.delete_test_release == true || inputs.delete_test_release == 'true') && inputs.diagnose_snapshot_profiles != true && inputs.diagnose_snapshot_profiles != 'true' && github.ref == 'refs/heads/fork/main' }}
    name: Delete test release
    needs: validate-cleanup-ref
    runs-on: rari
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Delete Gitea test release and mirrored tag
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          DELETE_TEST_RELEASE: 'true'
        run: node .github/scripts/fork-release.mjs
