name: Fork PR check

on:
  pull_request:
    branches:
      - feat/jemalloc-0.14.13-cachefix

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: rari checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-07-17
          components: clippy, rustfmt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: fork-pr-check

      - name: Create snapshot placeholder
        run: |
          mkdir -p crates/rari/snapshots
          touch crates/rari/snapshots/RARI_SNAPSHOT.bin
          echo 'pub static RESIDUAL_LAZY_ESM_SOURCES: &[(&str, &str)] = &[];' > crates/rari/snapshots/residual_lazy_sources.rs
          echo 'pub static RESIDUAL_LAZY_JS_SOURCES: &[(&str, &str)] = &[];' >> crates/rari/snapshots/residual_lazy_sources.rs

      - name: Generate V8 snapshot
        run: cargo run --manifest-path tools/snapshot/Cargo.toml -- crates/rari/snapshots

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --package rari --all-targets --all-features -- -D warnings

      - name: Test rari
        run: cargo test --package rari --all-features

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript packages
        run: |
          pnpm --filter=@rari/logger run build
          pnpm --filter=@rari/deploy run build
          pnpm --filter=rari run build

      - name: Link built workspace binaries
        run: pnpm install --frozen-lockfile

      - name: Build rari binary
        run: |
          cargo build --bin rari
          mkdir -p packages/rari-linux-x64/bin
          cp target/debug/rari packages/rari-linux-x64/bin/rari
          chmod +x packages/rari-linux-x64/bin/rari

      - name: Install Playwright
        run: pnpm playwright install chromium --with-deps

      - name: Test server response availability
        run: pnpm exec playwright test test/e2e/server-response.spec.ts --project='Desktop Chrome' --workers=1
