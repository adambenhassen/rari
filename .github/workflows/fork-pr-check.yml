name: Fork PR check

on:
  pull_request:

permissions: {}

jobs:
  check:
    name: rari checks
    runs-on: inference-x64
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PNPM_CONFIG_WORKSPACE_CONCURRENCY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Test fork release publishing
        run: node --test .github/scripts/fork-release.test.mjs

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle React ESM vendor files
        run: pnpm --filter @rari/bundle-react-esm bundle

      - name: Build JavaScript packages
        run: |
          pnpm --filter=@rari/lint run build
          pnpm --filter=@rari/use-cache run build
          pnpm --filter=@rari/logger run build
          pnpm --filter=@rari/deploy run build
          pnpm --filter=rari run build
          pnpm --filter=create-rari-app run build

      - name: Lint JavaScript
        run: pnpm lint

      - name: Typecheck JavaScript
        run: pnpm typecheck

      - name: Test JavaScript
        run: pnpm test:unit:run

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Install Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libclang-dev mold gdb

      - name: Create snapshot placeholder
        run: |
          mkdir -p crates/rari/snapshots
          touch crates/rari/snapshots/RARI_SNAPSHOT.bin
          echo 'pub static RESIDUAL_LAZY_ESM_SOURCES: &[(&str, &str)] = &[];' > crates/rari/snapshots/residual_lazy_sources.rs
          echo 'pub static RESIDUAL_LAZY_JS_SOURCES: &[(&str, &str)] = &[];' >> crates/rari/snapshots/residual_lazy_sources.rs

      - name: Generate V8 snapshot
        run: cargo run --manifest-path tools/snapshot/Cargo.toml -- crates/rari/snapshots

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy -p rari --all-targets --all-features -- -D warnings

      - name: Capture native Rust test abort stack
        run: |
          set -euo pipefail
          cargo test -p rari --all-features --no-run

          test_bin=""
          while IFS= read -r candidate; do
            test_listing="$("$candidate" --list 2>/dev/null || true)"
            if [[ "$test_listing" == *": test"* ]]; then
              test_bin="$candidate"
              break
            fi
          done < <(find target/debug/build/rari -type f -path '*/out/rari-*' -executable -print)

          if [ -z "$test_bin" ]; then
            echo 'Could not locate the rari library test binary'
            find target/debug/build/rari -type f -path '*/out/rari-*' -executable -print
            exit 1
          fi

          for attempt in $(seq 1 10); do
            log="$RUNNER_TEMP/rari-test-gdb-$attempt.log"
            set +e
            gdb --quiet --batch \
              -ex 'set pagination off' \
              -ex 'set print frame-arguments none' \
              -ex 'handle SIGABRT stop print nopass' \
              -ex run \
              -ex 'thread apply all bt' \
              --args "$test_bin" > "$log" 2>&1
            gdb_status=$?
            set -e

            if grep -q 'Program received signal SIGABRT' "$log"; then
              cat "$log"
              echo "Captured SIGABRT native stack on attempt $attempt"
              exit 1
            fi

            if [ "$gdb_status" -ne 0 ]; then
              cat "$log"
              exit "$gdb_status"
            fi

            grep 'test result:' "$log" || true
          done

          echo 'No SIGABRT reproduced in ten parallel test runs'

      - name: Test Rust
        run: cargo test -p rari --all-features

      - name: Detect jemalloc feature
        id: jemalloc
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          if jq -e '.packages[] | select(.name == "rari" and (.features | has("jemalloc")))' "$RUNNER_TEMP/cargo-metadata.json" >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build jemalloc E2E server
        if: steps.jemalloc.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cargo build -p rari --bin rari --features ext-full,jemalloc
          install -D target/debug/rari packages/rari-linux-x64/bin/rari

      - name: Install Playwright browser
        if: steps.jemalloc.outputs.enabled == 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Run jemalloc contract E2E
        if: steps.jemalloc.outputs.enabled == 'true'
        run: >-
          pnpm exec playwright test
          test/e2e/externalized-package-exports.spec.ts
          test/e2e/heap-profile.spec.ts
          test/e2e/metrics.spec.ts
          test/e2e/runtime-health.spec.ts
          test/e2e/server-response.spec.ts
          test/e2e/stale-render.spec.ts

      - name: Test getData prop isolation and response caching
        if: steps.jemalloc.outputs.enabled == 'true'
        run: >-
          pnpm exec playwright test test/e2e/dynamic-routes.spec.ts test/e2e/cache-warmup.spec.ts test/e2e/server-response-cache.spec.ts
          --grep='getData props|does not cache a getData throw or invalid props|serves a cached response when getData fails|Cache warmup|server-response-cache[.]spec[.]ts'
          --project='Desktop Chrome' --workers=1

      - name: Test server actions
        if: steps.jemalloc.outputs.enabled == 'true'
        run: >-
          pnpm exec playwright test test/e2e/server-actions.spec.ts
          test/e2e/server-actions-progressive-enhancement.spec.ts
          --project='Desktop Chrome' --workers=1
