name: Report GitHub PR status

on:
  workflow_run:
    workflows:
      - Fork PR check
    types:
      - completed

permissions: {}

jobs:
  report:
    name: Report rari checks status
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: inference-x64
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fork/main
          persist-credentials: false

      - name: Report status to GitHub
        env:
          RARI_GITHUB_TOKEN: ${{ secrets.RARI_GITHUB_TOKEN }}
        run: node .github/scripts/report-github-status.mjs
